<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Felix Planner — схема работы Telegram-бота</title>
  <desc id="desc">Авторская схема: сообщение превращается в предложение, человек подтверждает действие, задача попадает в рабочий контур.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#17151f"/>
      <stop offset=".52" stop-color="#0d0f17"/>
      <stop offset="1" stop-color="#191327"/>
    </linearGradient>
    <linearGradient id="metal" x2="1" y2="1">
      <stop stop-color="#f0eaf4"/>
      <stop offset=".48" stop-color="#a9a4b4"/>
      <stop offset="1" stop-color="#655e72"/>
    </linearGradient>
    <linearGradient id="pulse" x2="1">
      <stop stop-color="#5f438b" stop-opacity=".15"/>
      <stop offset=".52" stop-color="#b889ff"/>
      <stop offset="1" stop-color="#5f438b" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#b9a4d8" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#grid)"/>
  <path d="M 85 171 H 1315 M 85 743 H 1315" stroke="#aaa1b8" stroke-opacity=".18"/>
  <path d="M 85 795 H 1315" stroke="#aaa1b8" stroke-opacity=".10"/>
  <text x="86" y="92" fill="#b5a1d3" font-family="monospace" font-size="20" letter-spacing="5">PERSONAL SYSTEM / TELEGRAM</text>
  <text x="85" y="146" fill="url(#metal)" font-family="Arial, sans-serif" font-size="54" font-weight="600" letter-spacing="-2">Felix Planner</text>
  <text x="1315" y="105" fill="#8b8199" font-family="monospace" font-size="17" text-anchor="end" letter-spacing="3">FLOW  /  01—03</text>

  <path d="M 294 455 H 1106" stroke="#9a61e5" stroke-opacity=".4" stroke-width="26" filter="url(#glow)"/>
  <path d="M 294 455 H 1106" stroke="url(#pulse)" stroke-width="3"/>
  <path d="M 500 446 L 512 455 L 500 464 M 900 446 L 912 455 L 900 464" fill="none" stroke="#c6a0ef" stroke-width="2"/>

  <g fill="#171521" stroke="#6e627c" stroke-width="2">
    <rect x="88" y="268" width="357" height="375" rx="23"/>
    <rect x="522" y="268" width="357" height="375" rx="23"/>
    <rect x="956" y="268" width="357" height="375" rx="23"/>
  </g>
  <g fill="none" stroke="#b88df1" stroke-width="2">
    <path d="M 109 300 v -10 h 10 M 414 290 h 10 v 10 M 109 611 v 10 h 10 M 414 621 h 10 v -10"/>
    <path d="M 543 300 v -10 h 10 M 848 290 h 10 v 10 M 543 611 v 10 h 10 M 848 621 h 10 v -10"/>
    <path d="M 977 300 v -10 h 10 M 1282 290 h 10 v 10 M 977 611 v 10 h 10 M 1282 621 h 10 v -10"/>
  </g>

  <g font-family="monospace" font-size="17" letter-spacing="3" fill="#a995c2">
    <text x="122" y="323">01 / ЗАХВАТ</text>
    <text x="556" y="323">02 / РЕШЕНИЕ</text>
    <text x="990" y="323">03 / ДЕЙСТВИЕ</text>
  </g>
  <g fill="none" stroke="#d4c5e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 228 380 h 75 a 22 22 0 0 1 22 22 v 29 a 22 22 0 0 1 -22 22 h -34 l -23 19 v -19 h -18 a 22 22 0 0 1 -22 -22 v -29 a 22 22 0 0 1 22 -22 z"/>
    <path d="M 239 408 h 53 M 239 425 h 36" stroke-opacity=".7"/>
    <rect x="663" y="382" width="74" height="74" rx="18"/>
    <path d="M 681 418 l 15 15 l 25 -30"/>
    <circle cx="1135" cy="419" r="39"/>
    <path d="M 1135 397 v 24 l 19 11"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#f0ebf4">
    <text x="122" y="519" font-size="31" font-weight="600">Сообщение</text>
    <text x="556" y="519" font-size="31" font-weight="600">Подтверждение</text>
    <text x="990" y="519" font-size="31" font-weight="600">Рабочий ритм</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#b2aabb" font-size="22">
    <text x="122" y="558">Задача обычными словами.</text>
    <text x="122" y="587">Без сложной формы.</text>
    <text x="556" y="558">Сначала предложение.</text>
    <text x="556" y="587">Решение остаётся за тобой.</text>
    <text x="990" y="558">Фокус, проекты, занятия</text>
    <text x="990" y="587">и точные напоминания.</text>
  </g>
  <g font-family="monospace" font-size="16" letter-spacing="3" fill="#8f829d">
    <text x="85" y="782">СХЕМА РАБОТЫ БОТА · НЕ СКРИНШОТ ИНТЕРФЕЙСА</text>
    <text x="1315" y="782" text-anchor="end">PYTHON / AIOGRAM / SQLITE</text>
  </g>
</svg>
